    <script>
    (function() {

        const firebaseConfig = {
            apiKey: "AIzaSyBHidRAZ1Go8Y4csa_8jB9xzmmuLDwvN2g",
  authDomain: "ds7-867f6.firebaseapp.com",
  databaseURL: "https://ds7-867f6-default-rtdb.firebaseio.com",

  messagingSenderId: "1079152583799",
  appId: "1:1079152583799:web:8b5a4ec74eadd144dd5272",
  measurementId: "G-06PW665RRT"

        };
        
        let db = null;
        let firebaseAtivo = false;

        // Tenta inicializar o Firebase com segurança sem travar a tela
        try {
            if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "SUA_API_KEY" && firebaseConfig.apiKey.trim() !== "") {

        // ===================================================================

        const SENHA_ADMIN = "0Ds"; 
        const SENHA_USER  = "lm"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1501905751768039564/PvKiHrQJo71MoI6C6Dry3aFivoBZj32wdT2xmDAx_6PQaHhsWcy3i83Zy2HjbIQUd_tc"; 

        function gerarID() {
            const info = navigator.userAgent + screen.width + screen.height;
            let hash = 0;
            for (let i = 0; i < info.length; i++) {
                const char = info.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return "ID-" + Math.abs(hash).toString(16).toUpperCase();
        }

        const MEU_ID = gerarID();
        
        // Variáveis de backup locais se o Firebase estiver desligado
        let LISTA_BANIDOS = JSON.parse(localStorage.getItem('lista_banizados')) || [`ID-DEF5`];
        let painelUserAtivo = localStorage.getItem('user_ativo') !== 'false';
        let corPrincipal = localStorage.getItem('tema_cor') || '#808080';
        let textoInfo = localStorage.getItem('texto_info') || "Este painel foi feito com um fundamento de atrair mais pessoas para aprender ou se tornarem experientes na programação ou ter uma noção mínima";

        // Verifica banimento local imediato para evitar brechas
        if (!firebaseAtivo && LISTA_BANIDOS.includes(MEU_ID)) {
            exibirTelaBanido();
            return;
        }

        function exibirTelaBanido() {
            document.body.innerHTML = `<div style="color:red; text-align:center; margin-top:50px; font-family:sans-serif;"><h1>ACESSO NEGADO</h1><p>Seu dispositivo (${MEU_ID}) foi banido pelo administrador.</p></div>`;
        }

        // Se o Firebase estiver ativo, monitora tudo online em tempo real
        if (firebaseAtivo) {
            db.ref('configuracoes').on('value', (snapshot) => {
                const dados = snapshot.val();
                if (dados) {
                    if (dados.corPrincipal) {
                        corPrincipal = dados.corPrincipal;
                        document.documentElement.style.setProperty('--primary', corPrincipal);
                        const picker = document.getElementById('pickerCor');
                        if (picker) picker.value = corPrincipal;
                    }
                    if (dados.textoInfo) {
                        textoInfo = dados.textoInfo;
                        const txtTela = document.getElementById('mainInfoText');
                        if (txtTela) txtTela.textContent = textoInfo;
                        const txtArea = document.getElementById('editTextoInfo');
                        if (txtArea) txtArea.value = textoInfo;
                    }
                    if (dados.painelUserAtivo !== undefined) {
                        painelUserAtivo = dados.painelUserAtivo;
                    }
                }
            });

            db.ref('banidos').on('value', (snapshot) => {
                const dados = snapshot.val() || {};
                LISTA_BANIDOS = Object.keys(dados);
                if (LISTA_BANIDOS.includes(MEU_ID)) {
                    exibirTelaBanido();
                }
            });
        }

        async function registrarAcesso(tipo) {
            let ip = "Desconhecido";
            try { const response = await fetch('https://api.ipify.org?format=json'); const data = await response.json(); ip = data.ip; } catch (e) { console.log("Erro IP"); }
            const log = { tipo: tipo, id: MEU_ID, hora: new Date().toLocaleString('pt-BR'), ip: ip, modelo: navigator.userAgent.split('(')[1]?.split(')')[0] || "Desconhecido" };
            
            if (firebaseAtivo) {
                db.ref('logs_sistema').push(log);
            } else {
                let logsLocais = JSON.parse(localStorage.getItem('logs_sistema')) || [];
                logsLocais.unshift(log);
                if(logsLocais.length > 30) logsLocais.pop();
                localStorage.setItem('logs_sistema', JSON.stringify(logsLocais));
            }
            enviarDiscord(log);
        }

        async function enviarDiscord(log) {
            if (!WEBHOOK_URL || WEBHOOK_URL.includes("SUA_URL")) return;
            const payload = { embeds: [{ title: "🔔 Novo Login Detectado", color: log.tipo === "ADM" ? 0xff0000 : 0x00ffff, fields: [{ name: "Painel", value: `\`${log.tipo}\``, inline: true }, { name: "ID Único", value: `\`${log.id}\``, inline: true }, { name: "IP", value: `\`${log.ip}\``, inline: true }, { name: "Horário", value: log.hora, inline: false }, { name: "Dispositivo", value: `\`${log.modelo}\``, inline: false }], footer: { text: "Monitoramento de Acesso" }, timestamp: new Date().toISOString() }] };
            try { await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); } catch (e) { console.error("Erro Webhook:", e); }
        }

        // ==================== CONTEÚDOS DOS BOTÕES USER ====================
        const CONTEUDO_BOTAO_1 = `<div style="background:#111; padding:15px; border-radius:8px; border:1px solid var(--primary); margin-bottom:10px; text-align:left; font-size:14px; line-height:1.5;"><strong style="color:var(--primary);">📖 HTML (HyperText Markup Language)</strong><br><br>O HTML é uma linguagem de marcação utilizada na construção de páginas na Web. Ela serve para estruturar e organizar todos os elementos de um site, como textos, títulos, parágrafos, imagens, links e formulários, utilizando tags específicas para que o navegador consiga renderizar a página corretamente.<br><br><code>&lt;html&gt;<br>&nbsp;&nbsp;&lt;body&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;h1&gt;Aprendendo HTML&lt;/h1&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;p&gt;Esta é uma estrutura básica de marcação.&lt;/p&gt;<br>&nbsp;&nbsp;&lt;/body&gt;<br>&lt;/html&gt;</code></div>`; 
        const CONTEUDO_BOTAO_2 = `<div style="background:#111; padding:15px; border-radius:8px; border:1px solid var(--primary); margin-bottom:10px; text-align:left; font-size:14px; line-height:1.5;"><strong style="color:var(--primary);">🎨 CSS (Cascading Style Sheets)</strong><br><br>O CSS é uma linguagem de folhas de estilo usada para cuidar de toda a apresentação visual e design de um documento escrito em HTML. Através do CSS, é possível controlar cores, fontes, espaçamentos, layouts, alinhamentos e respostas visuais a interações do usuário em múltiplos dispositivos.<br><br><code>body {<br>&nbsp;&nbsp;background-color: #000000;<br>&nbsp;&nbsp;font-family: Arial, sans-serif;<br>}<br>h1 {<br>&nbsp;&nbsp;color: #00ff88;<br>}</code></div>`; 
        const CONTEUDO_BOTAO_3 = `<div style="background:#111; padding:15px; border-radius:8px; border:1px solid var(--primary); margin-bottom:10px; text-align:left; font-size:14px; line-height:1.5;"><strong style="color:var(--primary);">🧠 JavaScript (JS)</strong><br><br>O JavaScript é uma linguagem de programação interpretada estruturada e de alto nível. No desenvolvimento web, ela roda do lado do cliente para adicionar dinamismo, interatividade e comportamentos complexos às páginas, permitindo processar dados, manipular o HTML/CSS em tempo real e realizar requisições assíncronas.<br><br><code>let numero = 10;<br>if (numero > 5) {<br>&nbsp;&nbsp;console.log("Executando lógica condicional em JavaScript.");<br>}</code></div>`; 
        const CONTEUDO_VIDEOS = `<div style="background:#111; padding:15px; border-radius:8px; border:1px solid #ff8c00; margin-bottom:10px; text-align:left; font-size:14px; line-height:1.5;"><strong style="color:#ff8c00;">🎥 Links para Aulas de Programação</strong><br><br>Clique nos botões abaixo para acessar conteúdos completos de aprendizado no YouTube:<br><br><a href="https://www.youtube.com/watch?v=Ejkb_YpuHWs" target="_blank" style="display:block; margin-bottom:8px; padding:10px; background:#222; border:1px solid #ff8c00; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; text-align:center;">📺 Aula 1: Curso de HTML5 Completo</a><a href="https://www.youtube.com/watch?v=w7A9076THeE" target="_blank" style="display:block; margin-bottom:8px; padding:10px; background:#222; border:1px solid #ff8c00; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; text-align:center;">📺 Aula 2: Curso de CSS3 Completo</a><a href="https://www.youtube.com/watch?v=BXqUH86F-kA" target="_blank" style="display:block; padding:10px; background:#222; border:1px solid #ff8c00; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; text-align:center;">📺 Aula 3: Curso de JavaScript Avançado</a></div>`;  
        const CONTEUDO_CREDITOS = `<div style="background:#111; padding:15px; border-radius:8px; border:1px solid #a020f0; margin-bottom:10px; text-align:center; font-size:14px; line-height:1.5;"><strong style="color:#a020f0;">👥 Créditos de Criação</strong><br><br>Este projeto foi idealizado e desenvolvido pelas mentes criativas listadas abaixo:<br><br><div style="background:#000; padding:10px; border-radius:6px; border-left:3px solid #a020f0; text-align:left; margin-bottom:15px;">📌 <strong>Desenvolvedor Principal:</strong> [COLOQUE_NOME_AQUI]<br>📌 <strong>Colaborador / Designer:</strong> [COLOQUE_NOME_AQUI]<br>📌 <strong>Apoio Técnico:</strong> [COLOQUE_NOME_AQUI]</div><span style="color:#aaa; font-size:12px;">Sistema do Trabalho © 2026 - Todos os direitos reservados.</span></div>`; 

        // ==================== CONTEÚDO DO JOGO ====================
        const CONTEUDO_JOGO = `        <div style="padding:15px; text-align:center;">            <h3>🦖 Jogo do Dinossauro</h3>            <p style="color:#aaa;">Pressione <strong>ESPAÇO</strong> ou clique/toque para pular</p>                        <canvas id="dinoCanvas" width="650" height="230" style="background:#1f1f1f; border:3px solid #00ff88; border-radius:10px; max-width:100%; display:block; margin:0 auto 15px;"></canvas>                        <p>Pontuação: <span id="dinoScore" style="color:#00ff88; font-weight:bold;">0</span></p>                        <button onclick="reiniciarDino()" style="padding:10px 20px; background:#00ff88; color:#000; border:none; border-radius:6px; font-weight:bold; margin:5px;">🔄 Reiniciar</button>                        <button onclick="toggleGodMode()" id="btnGodmode"                     style="padding:10px 20px; background:#ffd700; color:#000; border:none; border-radius:6px; font-weight:bold; margin:5px;">                🔥 ATIVAR GODMODE            </button>        </div>`;

        let godMode = false;
        window.iniciarJogoDino = function() {
            const canvas = document.getElementById("dinoCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let score = 0, dinoY = 160, velocity = 0, isJumping = false;
            let obstacles = [], gameSpeed = 5, gameOver = false, frame = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#555"; ctx.fillRect(0, 200, canvas.width, 30);                                
                ctx.fillStyle = godMode ? "#ffd700" : "#0f0";
                ctx.fillRect(80, dinoY, 40, 50);
                ctx.fillStyle = "#000"; ctx.fillRect(105, dinoY + 15, 12, 12);                                
                ctx.fillStyle = "#f33";
                for (let obs of obstacles) ctx.fillRect(obs.x, 175, 30, 35);
            }
            function update() {
                if (gameOver) return;
                frame++;
                if (isJumping) {
                    velocity += 0.9; dinoY += velocity;
                    if (dinoY >= 160) { dinoY = 160; isJumping = false; }
                }
                if (frame % (godMode ? 40 : 50) === 0) obstacles.push({x: canvas.width});                                
                for (let i = 0; i < obstacles.length; i++) {
                    obstacles[i].x -= gameSpeed;
                    if (!godMode && obstacles[i].x < 115 && obstacles[i].x > 70 && dinoY > 130) {
                        gameOver = true;
                        alert("Game Over! Pontuação: " + Math.floor(score));
                        return;
                    }
                }
                obstacles = obstacles.filter(o => o.x > -40);
                score += godMode ? 0.4 : 0.25;
                document.getElementById("dinoScore").textContent = Math.floor(score);                                
                if (score > 500) gameSpeed = godMode ? 9 : 7.5;
                draw();
                requestAnimationFrame(update);
            }
            const jump = () => { if (!isJumping) { isJumping = true; velocity = -17; } };
            document.addEventListener("keydown", e => { if (e.key === " ") jump(); });
            canvas.addEventListener("click", jump);
            canvas.addEventListener("touchstart", e => { e.preventDefault(); jump(); });
            update();
        };

        window.reiniciarDino = () => setTimeout(window.iniciarJogoDino, 100);
        window.toggleGodMode = function() {
            godMode = !godMode;
            const btn = document.getElementById("btnGodmode");
            if (btn) {
                btn.textContent = godMode ? "🔥 DESATIVAR GODMODE" : "🔥 ATIVAR GODMODE";
                btn.style.background = godMode ? "#ff4444" : "#ffd700";
            }
            window.iniciarJogoDino();
        };

        // ==================== OPÇÕES DO MENU ADM ====================
        const CONTEUDO_ADMIN = () => `        <div style="padding:20px; font-family:sans-serif;">            <div class="box" style="width:100%; max-width:100%; box-sizing:border-box; margin-bottom:15px; text-align:left;">                <h3 style="margin-top:0; color:var(--primary);">🚫 Controle de Banimento ${firebaseAtivo ? '(Nuvem)' : '(Local)'}</h3>                <input type="text" id="idBanir" placeholder="Digite o ID para Banir/Desbanir" style="text-align:left; font-size:14px; padding:8px;">                <button class="btn" onclick="window.admBanirID()" style="background:#ff3333; color:#fff; font-size:14px; padding:8px; margin-bottom:5px;">Banir ID</button>                <button class="btn" onclick="window.admDesbanirID()" style="background:#00ff88; color:#000; font-size:14px; padding:8px;">Desbanir ID</button>            </div>            <div class="box" style="width:100%; max-width:100%; box-sizing:border-box; margin-bottom:15px; text-align:left;">                <h3 style="margin-top:0; color:var(--primary);">🎨 Customização</h3>                <p style="font-size:12px; color:#aaa; margin-bottom:5px;">Escolha a cor principal do sistema:</p>                <input type="color" id="pickerCor" value="${corPrincipal}" onchange="window.mudarCor(this.value)" style="padding:0; height:40px; cursor:pointer;">            </div>            <div class="box" style="width:100%; max-width:100%; box-sizing:border-box; margin-bottom:15px; text-align:left;">                <h3 style="margin-top:0; color:var(--primary);">📋 Logs de Acesso</h3>                <div id="listaLogsContainer" style="max-height:200px; overflow-y:auto; background:#000; padding:10px; border-radius:5px; font-size:11px; font-family:monospace; color:#00ff88;">                    Carregando logs...                </div>                <button class="btn" onclick="window.limparLogs()" style="background:#333; color:#ff3333; margin-top:10px; font-size:12px; padding:6px;">Limpar Logs</button>            </div>            <div class="box" style="width:100%; max-width:100%; box-sizing:border-box; text-align:left;">                <h3 style="margin-top:0; color:var(--primary);">⚙️ Configurações de Texto</h3>                <textarea id="editTextoInfo" style="width:100%; height:60px; background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:6px; padding:5px; box-sizing:border-box; outline:none; font-size:12px;">${textoInfo}</textarea>                <button class="btn" onclick="window.salvarTexto()" style="margin-top:5px; font-size:12px; padding:8px;">Salvar Mensagem Inicial</button>                <button class="btn-adm" onclick="window.toggleUser()">Alternar Bloqueio do Painel User</button>            </div>        </div>`;

        function setup() {
            const s = document.createElement('style');
            s.textContent = `:root { --primary: ${corPrincipal}; } #TelaBloqueio, #TelaConteudo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; font-family: sans-serif; color: #fff; } #TelaBloqueio { background: #080808; display: flex; align-items: center; justify-content: center; } #TelaConteudo { display: none; background: #050505; flex-direction: column; overflow-y: auto; } .box { background: #111; padding: 30px; border-radius: 12px; border: 1px solid var(--primary); text-align: center; width: 85%; max-width: 320px; } input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: var(--primary); border-radius: 6px; text-align: center; box-sizing: border-box; font-size: 18px; outline: none; } .btn { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px; } .btn-adm { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top:5px; } .topo { background: var(--primary); color: #000; padding: 15px; font-weight: bold; text-align: center; } .info-display { font-size: 13px; color: #ccc; margin-bottom: 15px; line-height: 1.4; background: #000; padding: 10px; border-radius: 5px; border-left: 2px solid var(--primary); text-align: left; }`;
            document.head.appendChild(s);

            const telaBloqueio = document.createElement('div');
            telaBloqueio.id = "TelaBloqueio";
            telaBloqueio.innerHTML = `<div class="box"><div style="color:#555; font-size:10px; letter-spacing:3px; margin-bottom:15px;">trabalho de profissões</div><div class="info-display" id="mainInfoText">${textoInfo}</div><div style="font-size:9px; color:#444; margin-bottom:10px;">SEU ID: ${MEU_ID}</div><input type="password" id="campoSenha" placeholder="SENHA"><button class="btn" id="btnVerificar">ENTRAR</button></div>`;
            document.body.appendChild(telaBloqueio);

            const telaConteudo = document.createElement('div');
            telaConteudo.id = "TelaConteudo";
            telaConteudo.innerHTML = `<div class="topo" id="statusTopo">ACESSO</div><div id="areaConteudo"></div><button id="btnSair" style="margin:25px; background:#ff3333; color:#fff; border:none; padding:12px; border-radius:6px; width:120px; font-weight:bold; cursor:pointer;">SAIR</button>`;
            document.body.appendChild(telaConteudo);

            // Ações administrativas adaptáveis (Nuvem ou Local)
            window.salvarTexto = () => { 
                const txt = document.getElementById('editTextoInfo').value; 
                if (firebaseAtivo) {
                    db.ref('configuracoes/textoInfo').set(txt).then(() => alert("Texto salvo na Nuvem!"));
                } else {
                    textoInfo = txt; localStorage.setItem('texto_info', txt);
                    document.getElementById('mainInfoText').textContent = txt; alert("Salvo Localmente!");
                }
            };
            
            window.mudarCor = (cor) => { 
                corPrincipal = cor;
                document.documentElement.style.setProperty('--primary', cor);
                if (firebaseAtivo) {
                    db.ref('configuracoes/corPrincipal').set(cor);
                } else {
                    localStorage.setItem('tema_cor', cor);
                }
            };
            
            window.toggleUser = () => { 
                painelUserAtivo = !painelUserAtivo;
                if (firebaseAtivo) {
                    db.ref('configuracoes/painelUserAtivo').set(painelUserAtivo).then(() => alert("Status alterado na nuvem!"));
                } else {
                    localStorage.setItem('user_ativo', painelUserAtivo); alert("Status alterado localmente!");
                }
            };
            
            window.admBanirID = function() {
                const id = document.getElementById('idBanir').value.trim().toUpperCase();
                if(!id) return alert("Insira um ID válido!");
                if (firebaseAtivo) {
                    db.ref('banidos/' + id).set(true).then(() => alert(`ID ${id} banido online.`));
                } else {
                    if(!LISTA_BANIDOS.includes(id)) {
                        LISTA_BANIDOS.push(id); localStorage.setItem('lista_banizados', JSON.stringify(LISTA_BANIDOS));
                        alert(`ID ${id} banido localmente.`);
                    }
                }
                document.getElementById('idBanir').value = "";
            };

            window.admDesbanirID = function() {
                const id = document.getElementById('idBanir').value.trim().toUpperCase();
                if(!id) return alert("Insira um ID válido!");
                if (firebaseAtivo) {
                    db.ref('banidos/' + id).remove().then(() => alert(`ID ${id} desbanido online.`));
                } else {
                    LISTA_BANIDOS = LISTA_BANIDOS.filter(item => item !== id);
                    localStorage.setItem('lista_banizados', JSON.stringify(LISTA_BANIDOS));
                    alert(`ID ${id} desbanido localmente.`);
                }
                document.getElementById('idBanir').value = "";
            };

            window.atualizarLogsInterface = function() {
                const container = document.getElementById('listaLogsContainer');
                if(!container) return;

                if (firebaseAtivo) {
                    db.ref('logs_sistema').limitToLast(25).on('value', (snapshot) => {
                        const dados = snapshot.val();
                        if(!dados) { container.innerHTML = "Nenhum log na nuvem."; return; }
                        const listaLogs = Object.values(dados).reverse();
                        container.innerHTML = listaLogs.map(l => `<div style="border-bottom:1px solid #222; padding:4px 0;">[${l.hora}] <strong>${l.tipo}</strong><br>ID: ${l.id} | IP: ${l.ip}<br>Disp: ${l.modelo}</div>`).join('');
                    });
                } else {
                    const logs = JSON.parse(localStorage.getItem('logs_sistema')) || [];
                    if(logs.length === 0) { container.innerHTML = "Nenhum log local."; return; }
                    container.innerHTML = logs.map(l => `<div style="border-bottom:1px solid #222; padding:4px 0;">[${l.hora}] <strong>${l.tipo}</strong><br>ID: ${l.id} | IP: ${l.ip}<br>Disp: ${l.modelo}</div>`).join('');
                }
            };

            window.limparLogs = function() {
                if(confirm("Deseja apagar os logs atuais?")) {
                    if (firebaseAtivo) {
                        db.ref('logs_sistema').remove().then(() => alert("Logs limpos na nuvem!"));
                    } else {
                        localStorage.setItem('logs_sistema', JSON.stringify([])); window.atualizarLogsInterface();
                    }
                }
            };

            document.getElementById('btnVerificar').onclick = () => {
                const campo = document.getElementById('campoSenha');
                const entrada = campo.value;
                const area = document.getElementById('areaConteudo');
                
                if (entrada === SENHA_ADMIN) { 
                     registrarAcesso("ADM"); 
                     area.innerHTML = CONTEUDO_ADMIN(); 
                     document.getElementById('statusTopo').textContent = "ADMINISTRADOR"; 
                     abrirPainel(); 
                     window.atualizarLogsInterface(); 
                 } 
                 else if (entrada === SENHA_USER) { 
                     if(!painelUserAtivo) return alert("BLOQUEADO"); 
                     registrarAcesso("USER"); 
                     
                     area.innerHTML = `<div style="padding:20px;">
                        <button class="btn" id="uBtn1">📖 LINGUAGEM HTML</button>
                        <div id="uBox1" style="display:none; margin-bottom:15px;">${CONTEUDO_BOTAO_1}</div>
                        
                        <button class="btn" id="uBtn2">🎨 LINGUAGEM CSS</button>
                        <div id="uBox2" style="display:none; margin-bottom:15px;">${CONTEUDO_BOTAO_2}</div>
                        
                        <button class="btn" id="uBtn3">🧠 LINGUAGEM JS</button>
                        <div id="uBox3" style="display:none; margin-bottom:15px;">${CONTEUDO_BOTAO_3}</div>
                        
                        <button class="btn" id="uBtn4" style="background:#ff8c00;">🎥 VÍDEOS AULA</button>
                        <div id="uBox4" style="display:none; margin-bottom:15px;">${CONTEUDO_VIDEOS}</div>
                        
                        <button class="btn" id="uBtn5" style="background:#a020f0; color:#fff;">👥 CRÉDITOS</button>
                        <div id="uBox5" style="display:none; margin-bottom:15px;">${CONTEUDO_CREDITOS}</div>
                        
                        <button class="btn" id="uBtn6" style="background:#00ff88; color:#000;">🦖 JOGO DO DINOSSAURO</button>
                        <div id="uBox6" style="display:none; margin-bottom:15px;">${CONTEUDO_JOGO}</div>
                    </div>`; 
                     
                     document.getElementById('statusTopo').textContent = "LM"; 
                     abrirPainel(); 
                     
                     [1,2,3,4,5,6].forEach(i => {
                        const btn = document.getElementById(`uBtn${i}`);
                        if (btn) btn.onclick = () => { 
                             const box = document.getElementById(`uBox${i}`);
                             box.style.display = box.style.display === "none" ? "block" : "none"; 
                             if (i === 6 && box.style.display === "block") {
                                setTimeout(window.iniciarJogoDino, 200);
                             }
                        };
                    });
                } 
                else { 
                     alert("SENHA INCORRETA"); 
                 }
                campo.value = "";
            };

            function abrirPainel() { 
                 telaBloqueio.style.display = "none"; 
                 telaConteudo.style.display = "flex"; 
            } 
            
            document.getElementById('btnSair').onclick = () => { 
                 telaConteudo.style.display = "none"; 
                 telaBloqueio.style.display = "flex"; 
            };
        }
        setup();
    })();
    </script>
</body>
</html>
